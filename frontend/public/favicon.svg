<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Card Border Filter / Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Mottled Leather Gradients -->
    <linearGradient id="woodBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3818" />
      <stop offset="25%" stop-color="#784920" />
      <stop offset="50%" stop-color="#4a2e12" />
      <stop offset="75%" stop-color="#693f1b" />
      <stop offset="100%" stop-color="#3d240c" />
    </linearGradient>

    <!-- Brown Oval Gradient -->
    <radialGradient id="ovalBrown" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a65e2e" />
      <stop offset="60%" stop-color="#8c4a1e" />
      <stop offset="90%" stop-color="#6e3612" />
      <stop offset="100%" stop-color="#4a2208" />
    </radialGradient>

    <!-- Oval Blue Rim -->
    <linearGradient id="ovalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Magic Blue Text Gradient -->
    <linearGradient id="magicBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="30%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Magic Text Outline Shadow -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Corner Rivet Red -->
    <radialGradient id="redRivet" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- 5 Mana Orb Shading (Spherical) -->
    <!-- White -->
    <radialGradient id="orbWhite" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>

    <!-- Blue -->
    <radialGradient id="orbBlue" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <!-- Black -->
    <radialGradient id="orbBlack" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#475569" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Red -->
    <radialGradient id="orbRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fecaca" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- Green -->
    <radialGradient id="orbGreen" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="80%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
  </defs>

  <!-- Outer Black Border (MTG Card Edge) -->
  <rect x="15" y="15" width="470" height="670" rx="22" fill="#000000" filter="url(#cardShadow)" />

  <!-- Inner Textured Border Area -->
  <rect x="36" y="36" width="428" height="628" rx="10" fill="url(#woodBorder)" stroke="#2b1708" stroke-width="3" />
  
  <!-- Outer Thin Inner Stroke -->
  <rect x="46" y="46" width="408" height="608" rx="6" fill="none" stroke="#1f1205" stroke-width="2" stroke-opacity="0.8" />

  <!-- 4 Corner Red Dots / Rivets -->
  <!-- Top Left -->
  <circle cx="62" cy="62" r="10" fill="url(#redRivet)" stroke="#3f1414" stroke-width="1.5" />
  <circle cx="60" cy="60" r="3" fill="#ffffff" fill-opacity="0.7" />

  <!-- Top Right -->
  <circle cx="438" cy="62" r="10" fill="url(#redRivet)" stroke="#3f1414" stroke-width="1.5" />
  <circle cx="436" cy="60" r="3" fill="#ffffff" fill-opacity="0.7" />

  <!-- Bottom Left -->
  <circle cx="62" cy="638" r="10" fill="url(#redRivet)" stroke="#3f1414" stroke-width="1.5" />
  <circle cx="60" cy="636" r="3" fill="#ffffff" fill-opacity="0.7" />

  <!-- Bottom Right -->
  <circle cx="438" cy="638" r="10" fill="url(#redRivet)" stroke="#3f1414" stroke-width="1.5" />
  <circle cx="436" cy="636" r="3" fill="#ffffff" fill-opacity="0.7" />

  <!-- Large Central Oval -->
  <ellipse cx="250" cy="350" rx="192" ry="285" fill="url(#ovalBrown)" stroke="url(#ovalRim)" stroke-width="9" />
  <ellipse cx="250" cy="350" rx="186" ry="279" fill="none" stroke="#172554" stroke-width="2.5" />

  <!-- ======================================================================
       MAGIC ARCH LOGO
       ====================================================================== -->
  <g transform="translate(250, 185)" filter="url(#glowBlue)">
    <!-- MAGIC arched typography -->
    <path d="M -180,50 Q 0,-35 180,50" id="magicCurve" fill="none" />
    <text font-family="'Cinzel', 'Trajan Pro', 'Palatino', 'Georgia', 'Arial Black', serif" font-weight="900" font-size="78" letter-spacing="4" text-anchor="middle">
      <textPath href="#magicCurve" startOffset="50%" text-anchor="middle" fill="#000000" stroke="#000000" stroke-width="14" stroke-linejoin="round">
        MAGIC
      </textPath>
      <textPath href="#magicCurve" startOffset="50%" text-anchor="middle" fill="url(#magicBlue)" stroke="#1d4ed8" stroke-width="3">
        MAGIC
      </textPath>
    </text>
  </g>

  <!-- "The Gathering" subtext -->
  <g transform="translate(250, 246)">
    <text x="0" y="0" font-family="'Book Antiqua', 'Georgia', 'Baskerville', serif" font-weight="700" font-size="28" font-style="italic" fill="#000000" text-anchor="middle" stroke="#000000" stroke-width="4">
      The Gathering
    </text>
    <text x="0" y="0" font-family="'Book Antiqua', 'Georgia', 'Baskerville', serif" font-weight="700" font-size="28" font-style="italic" fill="#ea580c" text-anchor="middle">
      The Gathering
    </text>
  </g>

  <!-- ======================================================================
       5 CENTRAL MANA ORBS (WUBRG)
       ====================================================================== -->
  <g id="manaColorWheel" transform="translate(250, 425)">
    <!-- White Orb (Top) -->
    <circle cx="0" cy="-60" r="14" fill="url(#orbWhite)" stroke="#271808" stroke-width="2" />
    <circle cx="-3" cy="-63" r="4" fill="#ffffff" fill-opacity="0.8" />

    <!-- Blue Orb (Right) -->
    <circle cx="58" cy="-18" r="14" fill="url(#orbBlue)" stroke="#271808" stroke-width="2" />
    <circle cx="55" cy="-21" r="4" fill="#ffffff" fill-opacity="0.8" />

    <!-- Black Orb (Bottom Right) -->
    <circle cx="36" cy="50" r="14" fill="url(#orbBlack)" stroke="#271808" stroke-width="2" />
    <circle cx="33" cy="47" r="4" fill="#ffffff" fill-opacity="0.5" />

    <!-- Red Orb (Bottom Left) -->
    <circle cx="-36" cy="50" r="14" fill="url(#orbRed)" stroke="#271808" stroke-width="2" />
    <circle cx="-39" cy="47" r="4" fill="#ffffff" fill-opacity="0.8" />

    <!-- Green Orb (Left) -->
    <circle cx="-58" cy="-18" r="14" fill="url(#orbGreen)" stroke="#271808" stroke-width="2" />
    <circle cx="-61" cy="-21" r="4" fill="#ffffff" fill-opacity="0.8" />
  </g>
</svg>
